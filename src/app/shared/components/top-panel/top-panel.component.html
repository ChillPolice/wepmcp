<div class="top-panel">
  <button class="toggle" type="button" aria-label="Toggle sidebar" popovertarget="sidebar-popover"
    popovertargetaction="toggle">
    ☰
  </button>

  <div class="spacer"></div>

  <button class="toggle toggle--chat" type="button" aria-label="Toggle chat" popovertarget="chat-popover"
    popovertargetaction="toggle">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
    </svg>
  </button>

  <pls-theme-dropdown />

  <pls-sidebar ngSkipHydration>
  </pls-sidebar>

  <pls-sidebar popoverId="chat-popover" side="right" ngSkipHydration>
    <pls-chat-panel></pls-chat-panel>
  </pls-sidebar>
</div>
